<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E141A" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rep Planner">
  <title>Rep Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Rep <span>Planner</span></h1>
    <div class="sync" id="sync">Loading your plan…</div>
  </header>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="week" aria-selected="false">Week</button>
    <button role="tab" data-tab="workouts" aria-selected="false">Workouts</button>
    <button role="tab" data-tab="library" aria-selected="false"><span class="lg">Exercises</span><span class="sm">Library</span></button>
    <button role="tab" data-tab="progress" aria-selected="false">Progress</button>
    <button role="tab" data-tab="body" aria-selected="false">Body</button>
  </nav>
  <main id="view"></main>
</div>
<div id="sheet"></div>
<div class="toast" id="toast" hidden></div>
<script src="js/app.js"></script>
</body>
</html>
